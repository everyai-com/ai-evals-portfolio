# Secret-scanning rules. Order matters: when several rules hit the same line the first one wins,
# so specific token formats come before the generic assignment rule. A named group `value`
# selects the part that is masked and matched against placeholders; otherwise the whole match. `severity` drives blocking
# (critical/high block the deploy, medium/low warn).
rules:
  - id: aws_access_key
    name: AWS access key id
    pattern: '(?<![A-Z0-9])(AKIA|ASIA)[A-Z0-9]{16}(?![A-Z0-9])'
    severity: critical
    fix: remove the literal, read it from the platform secret store, and rotate the key in IAM
  - id: github_token
    name: GitHub token
    pattern: '\bgh[pousr]_[A-Za-z0-9]{36,}\b'
    severity: high
    fix: revoke the token in GitHub settings and inject it as a platform secret
  - id: slack_token
    name: Slack token
    pattern: '\bxox[baprs]-[0-9A-Za-z-]{10,}\b'
    severity: high
    fix: revoke the token in the Slack app config and inject it as a platform secret
  - id: stripe_live_key
    name: Stripe live key
    pattern: '\b[sr]k_live_[0-9a-zA-Z]{16,}\b'
    severity: critical
    fix: roll the key in the Stripe dashboard and inject it as a platform secret
  - id: private_key_block
    name: Private key block
    pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY(?: BLOCK)?-----'
    severity: critical
    fix: delete the key material from the artifact and provision certificates through the platform
  - id: jwt
    name: JSON Web Token
    pattern: '\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'
    severity: medium
    fix: never ship a signed token; mint tokens at runtime from the identity service
  - id: url_credentials
    name: URL with embedded credentials
    pattern: '\b[a-z][a-z0-9+.-]*://[^/\s:@''"]+:[^/\s@''"]+@[^\s/''"]+'
    severity: high
    fix: strip the user:password from the URL and read the credential from the secret store
  - id: generic_api_key
    name: Generic credential assignment
    pattern: '(?i)\b(?:api[_-]?key|secret|token|password|passwd|auth[_-]?key)\w*\s*[:=]\s*[''"]?(?P<value>[A-Za-z0-9_\-/+=]{16,})[''"]?'
    severity: medium
    fix: read the value from the environment / secret store instead of a literal
entropy:
  min_length: 20
  min_bits_per_char: 4.3     # hex (and UUID) tops out at 4.0 bits/char; base64 random strings sit at 4.5-5
  severity: medium
  fix: if this is a credential move it to the secret store; if it is a content hash list it in .deploygateignore (allow-value)
