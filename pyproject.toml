[project]
name = "ai-evals-portfolio"
version = "0.1.0"
description = "15 AI Evals Engineering systems: trajectory grading, shadow routing, calibrated judges, CI gates, RAG adversarial harness, DPO flywheel, significance engine, red-team fuzzer, drift monitor, Pareto dashboard, counterfactual replay, synthetic edge cases, context eviction tester, contamination checker, methodology teardowns."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.17,<0.18"]
anthropic = ["anthropic>=0.40"]
train = ["torch", "transformers", "peft", "trl", "datasets"]
embed = ["sentence-transformers"]

[project.entry-points.pytest11]
evalkit = "evalkit.pytest_plugin"

[project.scripts]
evalkit = "evalkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalkit", "projects"]

[tool.pytest.ini_options]
testpaths = ["tests", "projects"]
addopts = "-q"
markers = ["slow: slow tests", "live: requires a live LLM API"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Planted fixtures: code that is wrong on purpose so p22 and p23 have something to find.
extend-exclude = [
  "projects/p22_deploy_gate/data/sample_artifact_template",
  "projects/p23_bloat_detector/data/bloated_repo",
  "projects/p23_bloat_detector/data/clean_repo",
]

[tool.ruff.lint]
ignore = [
  "RUF046",  # int(round(x)): numpy>=1.26 is allowed, and on numpy 1.x round() returns a float64
]
